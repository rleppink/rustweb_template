[workspace]
members = [".", "migration", "tools/tidy"]

# Shared lint policy for every workspace member.
# Style-ish lints are `warn`; genuinely-never-acceptable ones are `deny`/`forbid`.
# CI enforces `-D warnings` so warnings can't rot (see .github/workflows/ci.yml).
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
float_cmp = "warn"
undocumented_unsafe_blocks = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Integer overflow silently wraps in release by default — turn the checks back on.
[profile.release]
overflow-checks = true
lto = "thin"           # cross-crate inlining across the ~350-crate tree
codegen-units = 1      # let the optimizer see whole crates; slower to compile
strip = "symbols"      # drop symbols from the final binary

[package]
name = "rustweb"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
migration = { path = "migration" }
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.0", features = ["trace"] }
# Pinned to 0.14.x: tower-sessions 0.15 depends on tower-sessions-core 0.15,
# but tower-sessions-sqlx-store 0.15 still targets core 0.14 — the two would
# not type-check against each other.
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
argon2 = "0.5.3"
time = "0.3.55"
# SeaORM's sqlx-postgres backend stores timestamps as chrono types (its
# default `with-chrono` feature); `time` above is only the session expiry's.
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
# GCRA rate limiting for /auth/* (per-IP). The `axum` feature makes
# GovernorError convertible into axum responses.
tower-governor = { package = "tower_governor", version = "0.8", features = ["axum"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
